name: OSV-Scanner

# Dependency CVE scan on every PR (new vulnerabilities only), on main, and
# weekly. No account, no secret: the scanner reads the lockfile and queries
# osv.dev. Findings land in the repo's Security tab.

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  scan-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0"
  scan-full:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0"
